<!doctype html>
<html lang="it">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Document</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
	<script type="module" src="assets/js/script.js"></script>
</head>

<body>
	<header class="text-white text-center py-5 px-3" style="background-color: #1f365c;">
		<div class="container">
			<h1 class="fw-bold mb-2">La mia libreria</h1>
			<p class="mb-0 text-white-50 fs-5">Aggiungi i tuoi libri e segnali come letti.</p>
		</div>
	</header>
	<hr>
	
		
	<form class="ms-4" id="form-libro">
  <h1 class="h4 mb-3">Aggiungi un libro</h1>
  
  <div class="mb-3">
    <label for="titolo" class="form-label">Titolo</label>
    <input type="text" class="form-control" id="titolo" required>
  </div>
  
    <div class="mb-3">
    <label for="titolo" class="form-label">Titolo</label>
    <input type="text" class="form-control" id="titolo" required>
  </div>
  
   <div class="mb-3">
    <label for="autore" class="form-label">Autore</label>
    <input type="text" class="form-control" id="autore" required>
  </div>
  
  <div class="mb-3">
    <label for="anno" class="form-label">Anno</label>
    <input type="number" class="form-control" id="anno" required>
  </div>
  
  <div class="mb-3">
    <label for="formato" class="form-label">Formato</label>
    <select class="form-select" id="formato">
      <option value="cartaceo" selected>Cartaceo</option>
      <option value="digitale">Digitale</option>
    </select>
  </div>
  
  <button type="submit" class="btn btn-primary">Aggiungi</button>
</form>

<hr>
<div class="ms-4 mt-4">
  <h2>I tuoi libri (<span id="contatore">0</span>)</h2>
  <div id="lista-libri"></div>
</div>
</body>

</html>
